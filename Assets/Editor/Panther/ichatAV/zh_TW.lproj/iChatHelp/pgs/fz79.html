的使用者才能邀請好友加入單向的視訊聊天。</font></p></td>	</tr></table><table width="100%" border="0" cellspacing="0" cellpadding="7">	<tr valign="top">	<td align="left"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial"></td>	<td align="right"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial"></font></td>	</tr></table></div></body></html>
