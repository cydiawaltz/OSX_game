ple LiGothic,Lucida Grande,Helvetica">2.</font></td><td><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial">按“編輯圖片…”一下，再按攝影機圖像一下。</font></td></tr></table>	<table border="0" cellspacing="0" cellpadding="3"><tr valign="top"><td width="16"></td><td><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Helvetica">幾秒鐘後，攝影機就會拍下一張靜態的視訊影像。您可以拖移滑桿來縮放您的圖片，然後上下左右拖移圖片，讓圖片剛好位於圖框的中心。</font></td></tr></table>	<table border="0" cellspacing="0" cellpadding="3"><tr valign="top"><td width="16"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Helvetica">3.</font></td><td><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial">調整好圖片的位置和大小之後，請按“設定”一下。</font></td></tr></table>	<table border="0" cellspacing="0" cellpadding="3"><tr valign="top"><td width="16"></td><td><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Helvetica">您也可以按“選取…”一下來挑選您儲存在電腦其他位置上的圖片或圖像。</font></td></tr></table>	</font>	</td>	</tr></table></div><table width="100%" border="0" cellspacing="0" cellpadding="7">	<tr>	<td><p><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial">您可以在“最近使用過的圖片”彈出式選單裡挑選圖片，這樣您就可以任意切換使用最近用過的圖片。這個彈出式選單最多可儲存 15 張圖片。</font></p></td>	</tr></table><table width="100%" border="0" cellspacing="0" cellpadding="7">	<tr valign="top">	<td align="left"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial"></td>	<td align="right"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial"></font></td>	</tr></table></div></body></html>
