idth="16"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Helvetica">2.</font></td><td><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial">選擇您要傳送的檔案，然後按“傳送”一下。您一次只能夠傳送一個檔案。如果檔案很大或者是您想同時傳送多個檔案，在傳送之前您應該先壓縮檔案。</font></td></tr></table>	<table border="0" cellspacing="0" cellpadding="3"><tr valign="top"><td width="16"></td><td><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Helvetica">對方可以選擇接受或拒絕您所傳送的檔案。</font></td></tr></table>	</font>	</td>	</tr></table></div><table width="100%" border="0" cellspacing="0" cellpadding="7">	<tr>	<td><p><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial">秘訣：要快速傳送檔案，請將檔案拖到“好友列表”的好友名稱上，或拖到聊天視窗內的訊息區域裡。</font></p></td>	</tr></table><table width="100%" border="0" cellspacing="0" cellpadding="7">	<tr valign="top">	<td align="left"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial"></td>	<td align="right"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial"></font></td>	</tr></table></div></body></html>
