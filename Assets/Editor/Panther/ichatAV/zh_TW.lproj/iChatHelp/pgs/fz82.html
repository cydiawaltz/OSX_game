g="0" cellpadding="3"><tr valign="top"><td width="16"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Helvetica"><b>&#149;</b></font></td><td><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial">如果您是使用備有內建麥克風的攝影機，請確定攝影機已經正確地連接到電腦上並且已將其開啟。</font></td></tr></table>	<table border="0" cellspacing="0" cellpadding="3"><tr valign="top"><td width="16"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Helvetica"><b>&#149;</b></font></td><td><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial">請確定您沒有按下聊天視窗裡的“靜音”按鈕。</font></td></tr></table>	<table border="0" cellspacing="0" cellpadding="3"><tr valign="top"><td width="16"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Helvetica"><b>&#149;</b></font></td><td><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial">打開“系統偏好設定”並且按“聲音”一下。檢查電腦的音量設定。請確定未勾選“靜音”註記框。</font></td></tr></table>	</font>	</td>	</tr></table></div><table width="100%" border="0" cellspacing="0" cellpadding="7">	<tr valign="top">	<td align="left"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial"></td>	<td align="right"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial"></font></td>	</tr></table></div></body></html>
