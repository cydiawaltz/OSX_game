#149;</b></font></td><td><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial">要將聊天視窗放大到填滿整個螢幕，請選擇“視訊”>“全螢幕”。</font></td></tr></table>	<table border="0" cellspacing="0" cellpadding="3"><tr valign="top"><td width="16"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Helvetica"><b>&#149;</b></font></td><td><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial">要縮放您的預覽影像，請將您的滑鼠指標指向影像視窗的最角落，然後拖移滑鼠來調整大小。</font></td></tr></table>	</font>	</td>	</tr></table></div><table width="100%" border="0" cellspacing="0" cellpadding="7">	<tr>	<td><p><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial">您也可以使用標示雙箭號的按鈕（位於視訊聊天視窗下方），在正常和全螢幕模式之間進行切換。如果選擇全螢幕模式，按鈕會出現在您的預覽影像視窗裡。按一下該按鈕可以切換回正常模式。</font></p></td>	</tr></table><table width="100%" border="0" cellspacing="0" cellpadding="7">	<tr valign="top">	<td align="left"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial"></td>	<td align="right"><font size="3" face="LiHei Pro,Apple LiGothic,Lucida Grande,Arial"></font></td>	</tr></table></div></body></html>
