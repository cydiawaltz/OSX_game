</FONT></FONT></b></font></td><td><font size="3" face="STXihei,Hei">要让聊天窗口充满整个屏幕，请选取“视频”&gt;“全屏幕”。</font></td></tr></table>	<table border="0" cellspacing="0" cellpadding="3"><tr valign="top"><td width="16"><font size="3" face="STXihei,Hei"><b><FONT SIZE="3" FACE="Geneva,STXihei"><FONT SIZE="2" FACE="Geneva,STXihei">&#8226;</FONT></FONT></b></font></td><td><font size="3" face="STXihei,Hei">要调整您的预览图像的大小，请将鼠标指针移到图像窗口的内角，然后拖移以调整图像的大小。</font></td></tr></table>	</font>	</td>	</tr></table></div><table width="100%" border="0" cellspacing="0" cellpadding="7">	<tr>	<td><p><font size="3" face="STXihei,Hei">要在普通模式和全屏幕模式间切换，您还可以使用位于视频聊天窗口底部的带双箭头的按钮。当您在全屏幕模式时，按钮会显示在您的预览图像窗口中。点按它可以切换回正常的显示模式。</font></p></td>	</tr></table><table width="100%" border="0" cellspacing="0" cellpadding="7">	<tr valign="top">	<td align="left"><font size="3" face="STXihei,Hei"></td>	<td align="right"><font size="3" face="STXihei,Hei"></font></td>	</tr></table></div></body></html>
