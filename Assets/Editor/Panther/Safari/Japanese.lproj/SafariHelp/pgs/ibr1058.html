<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=Shift_JIS">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>指定した言語で Web ページを開く</title>		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 2:00:47 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">		<meta name="keywords" content="alsfri10161, alsfri10198, ">		<META NAME="description" CONTENT="Web サイトによっては、いくつかの言語で表示できる場合があります。「Safari」では、自動的に指定した言語でページを開くことができます。">	</head>	<body>		<a name="ibrw1058"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari アイコン" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>指定した言語で Web ページを開く</h1>			</div>			<p>Web サイトによっては、いくつかの言語で表示できる場合があります。「Safari」では、自動的に指定した言語でページを開くことができます。指定した言語は、「システム環境設定」の「言語環境」を使って設定します。			<div id="taskbox">				<p>「システム環境設定」を開き、「言語環境」をクリックします。「言語」リストの一番上まで、指定した言語をドラッグします。			<p>			<p>「Safari」が開いていた場合は、いったん終了してから再び開きます。			</div>		</div>	</body>	</html>
