<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=Shift_JIS">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>画像が表示されない場合</title>		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 2:00:03 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">		<meta name="keywords" content="alsfri10198, alsfri10161, alsfri10202, ">		<META NAME="description" CONTENT="「Safari」環境設定の「アピアランス」パネルで、画像の表示オプションの選択を外していると、画像が表示されないことがあります。">	</head>	<body>		<a name="ibrw1033"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari アイコン" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>画像が表示されない場合</h1>			</div>			<p>Web ページの画像が表示されない場合は、画像を表示するオプションがオフになっているか、ネットワークに問題が生じている可能性があります。			<div id="taskbox">				<p>「Safari」メニューから「環境設定」を選択して、「アピアランス」をクリックします。「ページを開く時に画像を表示する」をクリックして選択します。			<p>			<p>このオプションが選択されていた場合は、ページを再読み込みしてみてください。「表示」メニューから「ページの再読込」を選択してください。			</div>		</div>	</body>	</html>
