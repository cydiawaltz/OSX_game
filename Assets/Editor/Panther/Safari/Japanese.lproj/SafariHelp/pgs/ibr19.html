<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=Shift_JIS">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>ブラウザの動きを監視する方法</title>		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 1:59:34 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">		<meta name="keywords" content="alsfri10202, ">		<META NAME="description" CONTENT="「Safari」が Web ページの要素をどのようにダウンロードするか監視するには、「ウインドウ」メニューから「構成ファイル一覧」を選択します。">	</head>	<body>		<a name="ibrw1018"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari アイコン" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>ブラウザの動きを監視する方法</h1>			</div>			<p>「Safari」が Web ページを読み込んでいるときに、ページの各要素がどのように読み込まれているかを監視することができます。これは Web ページの構成を調べる場合に役立つ機能です。			<div id="taskbox">				<p>「ウインドウ」メニューから「構成ファイル一覧」を選択し、その後 Web ページを開いてください。「Safari」はページが読み込んだ各要素を表示します。			<p>			<p>「構成ファイル一覧」ウインドウの中の項目だけをブラウザのウインドウで開くには、項目をダブルクリックします。			</div>			<p>別の Web ページを開くと、「構成ファイル一覧」ウインドウの内容が置き換えられます。		</div>	</body>	</html>
