<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=Shift_JIS">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>ブックマークバーにブックマークが見当たらない場合</title>		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 2:00:18 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">		<meta name="keywords" content="alsfri10197, alsfri10202, ">		<META NAME="description" CONTENT="ブックマークが多すぎてブックマークバーに表示しきれなくなると、バーの右端に 2 重右矢印のアイコンが表示されます。">	</head>	<body>		<a name="ibrw1041"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari アイコン" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>ブックマークバーにブックマークが見当たらない場合</h1>			</div>			<p>ウインドウが小さいためにすべてのブックマークを表示できず、ブックマークが隠れていることがあります。ブックマークバーの右端に 2 重右矢印のアイコンが表示されている場合は、アイコンを押すと隠されたブックマークが表示されます。			<p>			<p>あるいは、バーからブックマークを削除してしまった可能性もあります。その場合、ブックマークを再びバーに追加する必要があります。			<div id="taskbox">				<p>Web ページにブックマークを設定するには、目的のページを開いて、「ブックマーク」メニューから「追加」を選択します。ブックマークの名前を入力し、ポップアップメニューから場所を選択します。			</div>		</div>	</body>	</html>
