<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=Shift_JIS">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>キャッシュを空にする方法</title>		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 1:59:32 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">		<meta name="keywords" content="alsfri10202, alsfri10201, ">		<META NAME="description" CONTENT="ある Web ページの最新コンテンツを取得するには、「Safari」メニューから「キャッシュを空に」を選択します。">	</head>	<body>		<a name="ibrw1017"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari アイコン" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>キャッシュを空にする方法</h1>			</div>			<p>Web ページを開くたびに、「Safari」はページのコンテンツを“キャッシュ”と呼ばれる場所に一時的に保存して、次のそのページを開くときにすばやく開けるようにしています。			<p>			<p>開いたページが最新のコンテンツを表示していない場合には、キャッシュを空にする必要があります。また Web ページを作成しているユーザが、キャッシュを空にして最新のコンテンツを表示させたい場合もあるでしょう。			<div id="taskbox">				<p>「Safari」メニューから「キャッシュを空に」を選択して、「消去」をクリックしてください。			</div>		</div>	</body>	</html>
