<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=Shift_JIS">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>安全な Web サイトにフォームを送信する方法</title>		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 1:59:54 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">		<meta name="keywords" content="alsfri10198, alsfri10201, alsfri10199, ">		<META NAME="description" CONTENT="「Safari」環境設定の「セキュリティ」パネルから、保護されていないフォームの送信時に「Safari」が通知を出さないように設定できます。">	</head>	<body>		<a name="ibrw1028"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari アイコン" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>安全な Web サイトにフォームを送信する方法</h1>			</div>			<p>状況によっては、「Safari」で入力したフォームが、保護されていない状態で安全な Web サイトに送信されることがあります。「Safari」はこのような場合にメッセージを表示するように設定されており、情報のセキュリティに不安がある場合には、フォームを送信しないようにすることができます。			<div id="taskbox">				<p>このメッセージを表示しないようにするには、「Safari」メニューから「環境設定」を選択して、「セキュリティ」をクリックします。「セキュリティ保護されていないフォームを送信する前に尋ねる」チェックボックスの選択を外します。			</div>		</div>	</body>	</html>
