<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=euc-kr">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>웹 페이지가 사용자가 지정한 스타일 시트를 사용하여 나타내지 않습니다</title>		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 2:00:12 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">		<meta name="keywords" content="alsfri10202, alsfri10198, 모양새, 모양새를, 모양, 모양을, 모양새에서, 모양새에">		<META NAME="description" CONTENT="페이지에서 지정한 스타일 시트는 사용자가 작성한 스타일 시트로 대체될 수 있습니다.">	</head>	<body>		<a name="ibrw1038"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari Icon" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>웹 페이지가 사용자가 지정한 스타일 시트를 사용하여 나타내지 않습니다</h1>			</div>			<p>Safari는 페이지에서 지정한 스타일 시트 외에 사용자가 지정한 CSS(Cascading Style Sheet)를 사용합니다. 페이지에서 지정한 스타일 시트는 사용자가 작성한 스타일 시트로 대채될 수 있습니다.			<p>			<p>사용자가 작성한 스타일 시트를 페이지에서 사용해야 한다면, 올바른 스타일 시트를 지정했는지 확인하십시오.			<div id="taskbox">				<p>올바른 스타일 시트를 지정했는지 확인하려면, Safari 메뉴에서 환경설정을 선택한 다음, 고급을 클릭하십시오.			</div>		</div>	</body>	</html>
