<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=euc-kr">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>캐시 비우기</title>		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 1:59:32 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">		<meta name="keywords" content="alsfri10202, alsfri10201, ">		<META NAME="description" CONTENT="웹 페이지의 최근 내용을 보려면, Safari 메뉴에서 캐시 비우기를 선택하십시오.">	</head>	<body>		<a name="ibrw1017"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari Icon" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>캐시 비우기</h1>			</div>			<p>웹 페이지를 열면, Safari는 "캐시"라는 임시 위치에 페이지의 내용을 저장하여, 나중에 페이지를 빠르게 다시 열 수 있도록 합니다.			<p>			<p>페이지를 새로운 내용으로 열지 않는다면, 캐시 비우기를 해야 할 수 있습니다. 웹 페이지를 생성한다면, 새로운 내용이 나타나도록 캐시를 비워야 할 것입니다.			<div id="taskbox">				<p>Safari 메뉴에서 캐시 비우기를 선택한 다음, 비우기를 클릭하십시오.			</div>		</div>	</body>	</html>
