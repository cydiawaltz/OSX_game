<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=euc-kr">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>다른 응용 프로그램의 링크 여는 방법 설정하기</title>		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 2:00:24 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">		<meta name="keywords" content="alsfri10198, ">		<META NAME="description" CONTENT="다른 응용 프로그램의 링크를 새로운 윈도우로 열지 현재 윈도우로 열지 설정하려면  Safari 환경설정의 일반 패널을 여십시오.">	</head>	<body>		<a name="ibrw1044"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari Icon" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>다른 응용 프로그램의 링크 여는 방법 설정하기</h1>			</div>			<p>Safari가 기본 웹 브라우저라면, Mail과 같은 다른 응용 프로그램에서 링크를 클릭하거나 웹 인터넷 위치 파일의 아이콘을 이중 클릭하면 웹 페이지가 Safari로 열립니다. 페이지를 새로운 윈도우로 열지 현재 윈도우에서 열지 선택할 수 있습니다.			<div id="taskbox">				<p>Safari 메뉴에서 환경설정을 선택하고 "응용 프로그램에서 링크 열기" 선택사항을 선택하십시오.			</div>			<p>탭 브라우징을 활성화하고 "현재 윈도우"를 선택하면, 페이지가 현재 윈도우의 새로운 탭에서 열립니다.		</div>	</body>	</html>
