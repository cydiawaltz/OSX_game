<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=euc-kr">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>책갈피 막대에서 책갈피를 볼 수 없습니다</title>		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 2:00:18 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">		<meta name="keywords" content="alsfri10197, alsfri10202, ">		<META NAME="description" CONTENT="책갈피 막대에 여러 개의 책갈피가 있다면, 막대 오른쪽 끝에 오른쪽을 가리키는 아이콘이 나타납니다.">	</head>	<body>		<a name="ibrw1041"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari Icon" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>책갈피 막대에서 책갈피를 볼 수 없습니다</h1>			</div>			<p>윈도우가 너무 좁아 모든 책갈피를 표시할 수 없다면, 책갈피 일부가 표시되지 않을것입니다. 책갈피 막대의 오른쪽 끝에 있는 오른쪽을 가리키는 아이콘이 나타나는 경우, 아이콘을 눌러 책갈피를 추가로 볼 수 있습니다.			<p>			<p>막대에서 책갈피가 제거되었습니다. 만약 그렇다면, 책갈피를 막대에 다시 추가해야 합니다.			<div id="taskbox">				<p>페이지를 열고 책갈피 윈도우에서 책갈피 추가를 선택하십시오. 책갈피 이름을 입력하고 팝업 메뉴에서 위치를 선택하십시오.			</div>		</div>	</body>	</html>
