				<h1>Perch&eacute; alcune pagine web includono delle icone?</h1>
			</div>
			<p>Alcuni siti web includono un'icona per il sito, che Safari visualizza nella casella degli indirizzi e accanto ai preferiti e agli indirizzi nel menu "Cronologia". Per i siti web che non includono un'icona, Safari visualizza un'icona predefinita.
