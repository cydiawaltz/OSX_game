				<h1>Warum haben einige Web-Seiten Symbole?</h1>
			</div>
			<p>Einige Web-Sites legen ein Symbol fest, das Safari im Adressfeld sowie neben den Lesezeichen und Adressen im Men&uuml; "Verlauf" anzeigt. F&uuml;r Web-Sites, die kein Symbol festgelegt haben, zeigt Safari ein Standard-Symbol an.
