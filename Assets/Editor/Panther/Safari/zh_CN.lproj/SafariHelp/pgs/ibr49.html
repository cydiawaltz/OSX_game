<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=gb2312">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>删除网络表单中存储的数据</TITLE><META NAME="ROBOTS" CONTENT="KEYWORDS"><META NAME="KEYWORDS" CONTENT="自动文本网页网络图标删除网络表单中存储的数据删除存储表单标签安全safarialsfri10202alsfri10199alsfri10198Safari">		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 2:00:32 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">				<META NAME="description" CONTENT="您可以删除在网页表单中 Safari 所存储的数据。">	</head>	<body>		<a name="ibrw1048"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari icon" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>删除网络表单中存储的数据</h1>			</div>			<p>如果您选择了用其它网页的信息自动完成网络表单的选项，Safari 会存储您输入的信息。如果愿意，您可以删除此信息。			<div id="taskbox">				<p>从 Safari 菜单中选取“预置…”并点按“自动填充”。点按“其它表单”注记格旁的“编辑…”按钮。选择您要删除的项目并点按“移去”。如果想删除全部项目，请点按“移去全部”。			</div>			<p>如果不想使用其它网络表单的数据，请在 Safari 预置的“自动填充”面板中取消选择“其它表单”注记格。		</div>	</body>	</html>
