<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=gb2312">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>为网页制作书签</TITLE><META NAME="ROBOTS" CONTENT="KEYWORDS"><META NAME="KEYWORDS" CONTENT="页面文本为网页制作书签网页图标书签栏书签菜单书签safarialsfri10197Safari">		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 2:00:14 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">				<META NAME="description" CONTENT="点按地址栏中的“添加”按钮，为网页制作书签。">	</head>	<body>		<a name="ibrw1039"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari icon" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>为网页制作书签</h1>			</div>			<p>打开网页时，您可能想为它们制作书签，这样就可以快速返回到这些页面。			<div id="taskbox">				<p>要为网页制作书签，请打开该页面，然后从“书签”菜单中选取“添加书签”。如果地址栏中显示了“添加书签”按钮，您也可以直接点按它。			<p>			<p>键入书签的名称，并从弹出式菜单中选取您要它显示的位置。您可以将书签添加到书签栏、“书签”菜单或书签收藏夹。			</div>			<p>如果将地址栏中的图标拖移到书签栏，您也可以将书签添加到书签栏。			<p>			<p>要查看已添加到收藏夹中的书签，请从“书签”菜单中选取“显示全部书签”。		</div>	</body>	</html>
