<html>	<head>		<meta http-equiv="content-type" content="text/html;charset=gb2312">		<link href="../sty/task_style.css" rel="stylesheet" media="all">		<title>网页文本显示乱码</TITLE><META NAME="ROBOTS" CONTENT="KEYWORDS"><META NAME="KEYWORDS" CONTENT="预设语言页面文本编码文本网页文本显示乱码网页外观图标乱码编码safarialsfri10202alsfri10198alsfri10161Safari">		<meta name="copyright" content="Copyright 2003 Apple Computer, Inc. All Rights Reserved.">		<meta name="dategen" content="Wednesday, July 16, 2003 1:59:58 PM">		<meta name="generator" content="DB-5.9S, OSX-7.7css">				<META NAME="description" CONTENT="如果页面中的文本是乱码，您可能需要更改该页所用的文本编码。">	</head>	<body>		<a name="ibrw1031"></a><a name="IBic"></a>		<div id="mainbox">			<div id="caticon">				<IMG SRC="../gfx/IBic.gif" ALT="Safari icon" HEIGHT="32" WIDTH="32">			</div>			<div id="pagetitle">				<h1>网页文本显示乱码</h1>			</div>			<p>如果页面使用的字符与预设文本编码不符，而且页面无法识别正确的编码，则网页中的文本会显示乱码。			<div id="taskbox">				<p>要更改页面的编码，请在“显示”菜单中选择“文本编码”，然后为该页面中所使用的语言选取相应的编码。			<p>			<p>如果打开的页面经常出现乱码文本，您可能需要更改预设文本编码。从 Safari 菜单中选取“预置…”并点按“外观”。从“预设编码”弹出式菜单中选取相应的编码。			</div>		</div>	</body>	</html>
